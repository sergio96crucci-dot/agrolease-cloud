<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroLease Tracker V10 - Cloud</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2D5A27">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        :root {
            --primary: #2D5A27;
            --danger: #ef4444;
            --warning: #eab308;
            --success: #22c55e;
            --gray: #9ca3af;
            --blue: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Layout base (desktop) ── */
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a2a18;
        }
        body { display: flex; flex-direction: row; }

        /* ── Sidebar ── */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 1100;
            height: 100%;
            transition: margin-left .25s ease, transform .25s ease;
        }
        /* En escritorio se corre con margin negativo (no con transform) para que
           el mapa recupere el espacio en vez de quedar una franja en blanco. */
        .sidebar.hidden { margin-left: -320px; }

        .sb-header { background: var(--primary); color: white; padding: 20px; flex-shrink: 0; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-card { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 10px; text-transform: uppercase; opacity: 0.8; }
        .stat-value { font-size: 18px; font-weight: bold; }

        #field-list { flex: 1; overflow-y: auto; padding: 10px; background: #fdfdfd; -webkit-overflow-scrolling: touch; }
        .field-card { border: 1px solid #eee; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; background: white; position: relative; }
        .field-card:hover { border-color: var(--primary); }
        .fc-worker { font-weight: bold; font-size: 15px; color: #111; line-height: 1.2; }
        .fc-details { font-size: 11px; color: #666; margin-top: 4px; }
        .btn-del-card { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; }

        /* ── Mapa ── */
        .map-container {
            flex: 1;
            min-width: 0;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .search-bar {
            background: white;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 500;
            flex-wrap: wrap;
        }
        #map {
            flex: 1;
            width: 100%;
            /* Cede el control de gestos táctiles a Leaflet */
            touch-action: none;
        }

        /* ── Flecha lateral que despliega el panel ── */
        .sidebar-handle {
            position: fixed;
            left: 320px;                /* pegada al borde del panel abierto */
            top: 50%;
            transform: translateY(-50%);
            z-index: 1250;
            width: 26px; height: 70px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0 10px 10px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,.35);
            cursor: pointer;
            touch-action: manipulation;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            display: flex; align-items: center; justify-content: center;
            transition: left .25s ease;
        }
        .sidebar-handle:active { filter: brightness(1.2); }
        /* Panel cerrado: la flecha vuelve al borde de la pantalla */
        body.sb-cerrado .sidebar-handle { left: 0; }

        /* ── Overlay oscuro (mobile) detrás del sidebar ── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 1050;
        }
        .sidebar-overlay.active { display: block; }

        /* ── Leyenda ── */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            z-index: 1000;
            font-size: 0.78em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .color-box { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }

        /* ── Marcador GPS en vivo (estilo Google Maps) ── */
        .gps-live-icon { background: transparent; border: none; }
        .gps-marker-dot {
            width: 18px; height: 18px;
            background: #4285F4;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.45);
            position: absolute; top: 50%; left: 50%;
            margin: -12px 0 0 -12px;
        }
        .gps-marker-pulse {
            width: 18px; height: 18px;
            background: rgba(66,133,244,0.35);
            border-radius: 50%;
            position: absolute; top: 50%; left: 50%;
            margin: -9px 0 0 -9px;
            animation: gps-pulse 2s infinite ease-out;
        }
        @keyframes gps-pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            100% { transform: scale(3.2); opacity: 0; }
        }

        /* ── Botón flotante "Añadir campo" (reemplaza la toolbar de dibujo por defecto) ── */
        .btn-add-field {
            position: absolute;
            bottom: 24px;
            right: 16px;
            z-index: 1001;
            background: #2D5A27;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.35);
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-add-field:active { transform: scale(0.96); }
        .btn-add-field.drawing { background: var(--danger); }
        .btn-add-field.oculto  { display: none; }

        /* ── Barra de edición de forma del lote ── */
        .edit-shape-bar {
            display: none;
            position: absolute;
            bottom: 24px; left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            background: white;
            border-radius: 30px;
            box-shadow: 0 4px 14px rgba(0,0,0,.4);
            padding: 10px 12px;
            gap: 8px;
            align-items: center;
            max-width: calc(100vw - 24px);
        }
        .edit-shape-bar.visible { display: flex; }
        .edit-shape-bar .titulo {
            font-size: 11px; color: #555; font-weight: bold;
            padding: 0 6px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 34vw;
        }
        .edit-shape-bar button {
            border: none; border-radius: 20px;
            padding: 11px 16px; font-size: 13px; font-weight: bold;
            cursor: pointer; touch-action: manipulation; white-space: nowrap;
        }
        .btn-shape-save   { background: var(--primary); color: white; }
        .btn-shape-cancel { background: #eee; color: #555; }

        /* ── Aviso discreto de estado GPS ── */
        .gps-warning {
            display: none;
            position: absolute;
            top: 65px; left: 50%;
            transform: translateX(-50%);
            background: #fef3c7;
            color: #92400e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1000;
            white-space: nowrap;
            max-width: calc(100% - 20px);
            text-overflow: ellipsis;
            overflow: hidden;
        }

        /* ── Pantalla de acceso ── */
        .login-overlay {
            position: fixed; inset: 0;
            background: #1a2a18;
            display: none;
            align-items: center; justify-content: center;
            z-index: 10000; padding: 20px;
        }
        .login-overlay.visible { display: flex; }
        .login-box {
            background: white;
            padding: 28px 24px;
            border-radius: 14px;
            width: 340px; max-width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }
        .login-box h2 { color: var(--primary); font-size: 20px; margin-bottom: 4px; }
        .login-box p  { font-size: 12px; color: #666; margin-bottom: 18px; }
        .login-error {
            display: none;
            background: #fee2e2; color: #991b1b;
            padding: 9px 12px; border-radius: 6px;
            font-size: 12px; margin-bottom: 12px;
        }
        .login-error.visible { display: block; }

        /* ── Campana de vencimientos ── */
        .bell-btn {
            position: relative;
            padding: 8px 12px;
            background: #b45309; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; cursor: pointer;
            touch-action: manipulation; flex-shrink: 0; line-height: 1;
        }
        .bell-btn.apagada { background: #6b7280; }
        .bell-badge {
            position: absolute; top: -6px; right: -6px;
            background: var(--danger); color: white;
            border-radius: 10px; min-width: 18px; height: 18px;
            font-size: 10px; font-weight: bold;
            display: none; align-items: center; justify-content: center;
            padding: 0 5px; border: 2px solid white;
        }
        .bell-badge.visible { display: flex; }

        .venc-panel {
            display: none;
            position: absolute;
            top: 60px; left: 50%;
            transform: translateX(-50%);
            width: min(420px, calc(100vw - 20px));
            max-height: 60vh; overflow-y: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 26px rgba(0,0,0,.4);
            z-index: 1401;
        }
        .venc-panel.visible { display: block; }
        .venc-head {
            padding: 12px 14px; border-bottom: 1px solid #eee;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .venc-head b { font-size: 14px; color: #111; }
        .venc-item {
            padding: 11px 14px; border-bottom: 1px solid #f2f2f2;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        .venc-item:hover { background: #fafafa; }
        .venc-item:last-child { border-bottom: none; }
        .venc-pastilla {
            font-size: 10px; font-weight: bold; color: white;
            padding: 3px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
        }
        .venc-nombre  { font-size: 13px; font-weight: bold; color: #111; line-height: 1.25; }
        .venc-detalle { font-size: 11px; color: #777; margin-top: 2px; }
        .venc-vacio   { padding: 18px 14px; font-size: 12px; color: #888; text-align: center; }
        .venc-aviso-permiso {
            padding: 10px 14px; background: #fffbeb;
            font-size: 11px; color: #92400e; border-bottom: 1px solid #fde68a;
        }

        /* ── Sugerencias de localidad ── */
        .loc-wrap { position: relative; flex: 1; min-width: 0; }
        .loc-suggest {
            display: none;
            position: absolute;
            top: calc(100% + 4px); left: 0; right: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,.25);
            max-height: 260px; overflow-y: auto;
            z-index: 1400;
        }
        .loc-suggest.visible { display: block; }
        .loc-item {
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            line-height: 1.3;
        }
        .loc-item:last-child { border-bottom: none; }
        .loc-item:hover, .loc-item.activo { background: #eff6ff; }
        .loc-item .principal { font-weight: bold; color: #111; }
        .loc-item .detalle   { font-size: 11px; color: #777; }
        .loc-vacio { padding: 10px 12px; font-size: 12px; color: #888; }

        /* ── Indicador de sin conexión ── */
        .offline-badge {
            display: none;
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            background: #374151;
            color: #fde68a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1002;
            white-space: nowrap;
        }
        .offline-badge.visible { display: block; }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 12px;
        }
        .modal-box {
            background: white; padding: 22px; border-radius: 12px;
            width: 420px; max-width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #666; text-transform: uppercase; }
        .form-input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        .check-group { display: flex; align-items: center; gap: 8px; background: #eff6ff; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #dbeafe; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; touch-action: manipulation; }
        .btn-cancel { background: #eee; color: #666; border: none; padding: 10px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 5px; touch-action: manipulation; }

        /* ── Bloquear pull-to-refresh en Android Chrome ── */
        html { overscroll-behavior-y: none; }
        body { overscroll-behavior: none; position: fixed; }

        /* ══════════════════════════════════════════
           RESPONSIVE MOBILE
        ══════════════════════════════════════════ */
        @media (max-width: 768px) {
            body { flex-direction: column; }

            /* El sidebar se convierte en drawer lateral */
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                width: min(88vw, 310px);
                min-width: unset;
                transform: translateX(-100%);
                box-shadow: 3px 0 20px rgba(0,0,0,.3);
                z-index: 1200;
            }
            .sidebar.open { transform: translateX(0); }

            /* El mapa ocupa toda la pantalla */
            .map-container { width: 100vw; height: 100vh; }

            /* Barra superior más compacta */
            .search-bar { padding: 8px; gap: 6px; }
            .search-bar input { flex: 1 1 100%; order: 2; }
            .search-bar button:last-child { order: 3; }

            /* La flecha acompaña al ancho del drawer */
            .sidebar-handle { left: min(88vw, 310px); }
            body.sb-cerrado .sidebar-handle { left: 0; }

            /* Leyenda más pequeña */
            .legend { font-size: 0.72em; padding: 8px 10px; max-width: calc(100vw - 20px); }
        }

        /* En pantallas angostas la leyenda sube para no pelear con el botón flotante */
        @media (max-width: 420px) {
            .legend { bottom: 92px; }
        }

        /* Controles de Leaflet más grandes en táctil */
        @media (max-width: 768px) {
            .leaflet-control-zoom a,
            .leaflet-draw-toolbar a {
                width: 36px !important;
                height: 36px !important;
                line-height: 36px !important;
            }
        }
    </style>
</head>
<body>

<!-- Pantalla de acceso: la app no carga datos hasta que haya sesión iniciada -->
<div class="login-overlay" id="login-overlay">
    <form class="login-box" onsubmit="iniciarSesion(event)">
        <h2>AgroLease Tracker</h2>
        <p>Ingresá con tu cuenta para ver los lotes.</p>
        <div class="login-error" id="login-error"></div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" class="form-input" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="login-pass" class="form-input" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-btn" class="btn-primary">Entrar</button>
    </form>
</div>

<!-- Overlay para cerrar sidebar tocando afuera (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- Flecha al medio del borde izquierdo: despliega/repliega el panel -->
<button class="sidebar-handle" id="sidebar-handle" onclick="toggleSidebar()" title="Mostrar/ocultar panel">❮</button>

<div class="sidebar" id="sidebar">
    <div class="sb-header">
        <h3 style="font-size:16px;">AgroLease Tracker V10</h3>
        <p style="font-size:10px;opacity:0.7;">Análisis de Superficie Trabajada (Nube)</p>
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-label">Ha Enfocadas</div>
                <div id="total-ha" class="stat-value">0</div>
            </div>
            <div class="stat-card" style="background:rgba(239,68,68,0.2)">
                <div class="stat-label" style="color:#fca5a5">Riesgo Vencim.</div>
                <div id="total-alerts" class="stat-value">0</div>
            </div>
        </div>
    </div>
    <div style="padding:10px;border-bottom:1px solid #eee;">
        <input type="text" id="list-search" placeholder="Buscar Productor o Dueño..." class="form-input">
    </div>
    <div id="field-list"></div>
    <div style="padding:10px;display:flex;gap:5px;">
        <button onclick="exportData()" style="flex:1;font-size:10px;padding:5px;border-radius:4px;border:1px solid #ccc;cursor:pointer">Bajar Backup</button>
        <button onclick="document.getElementById('import').click()" style="flex:1;font-size:10px;padding:5px;border-radius:4px;border:1px solid #ccc;background:#fff7ed;cursor:pointer" title="Restaura un archivo de backup: sobrescribe los lotes que tengan el mismo ID">Restaurar Backup</button>
        <input type="file" id="import" style="display:none" accept=".json" onchange="importData(this)">
    </div>
</div>

<div class="map-container">
    <div class="search-bar">
        <button id="track-btn" onclick="toggleTracking()"
            style="padding:8px 12px;background:var(--success);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;touch-action:manipulation;white-space:nowrap;flex-shrink:0;"
            title="Activar/desactivar seguimiento en vivo">
            🎯 Siguiendo…
        </button>
        <button id="bell-btn" class="bell-btn apagada" onclick="togglePanelVencimientos()" title="Arrendamientos próximos a vencer">
            🔔<span id="bell-badge" class="bell-badge">0</span>
        </button>
        <div class="loc-wrap">
            <input type="text" id="loc-search" autocomplete="off"
                   placeholder="Ir a localidad (Ej: Las Varas)..."
                   style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;min-width:0;">
            <div id="loc-suggest" class="loc-suggest"></div>
        </div>
        <button onclick="buscarLocalidad()" style="padding:8px 14px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;touch-action:manipulation;">Ir</button>
    </div>
    <div id="map"></div>
    <div id="venc-panel" class="venc-panel"></div>
    <div id="offline-badge" class="offline-badge">📴 Sin conexión · los cambios se sincronizan al volver</div>
    <div id="gps-warning" class="gps-warning"></div>
    <button id="add-field-btn" class="btn-add-field" onclick="toggleAddField()" title="Dibujar un nuevo lote">
        ✏️ Añadir campo
    </button>
    <!-- Aparece al editar la forma de un lote: arrastrás los vértices y confirmás -->
    <div id="edit-shape-bar" class="edit-shape-bar">
        <span class="titulo" id="edit-shape-title">Editando forma</span>
        <button class="btn-shape-save"   onclick="guardarForma()">✓ Guardar</button>
        <button class="btn-shape-cancel" onclick="cancelarForma()">✕ Cancelar</button>
    </div>
    <div class="legend">
        <b>Estado de Gestión</b>
        <div class="legend-item"><div class="color-box" style="background:var(--blue)"></div> Propio</div>
        <div class="legend-item"><div class="color-box" style="background:var(--success)"></div> Año 1</div>
        <div class="legend-item"><div class="color-box" style="background:var(--warning)"></div> Año 2</div>
        <div class="legend-item"><div class="color-box" style="background:var(--danger)"></div> Año 3 (Crítico)</div>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <h4 id="modal-title" style="margin-bottom:15px;">Datos del Lote</h4>
        <div class="check-group">
            <input type="checkbox" id="f-is-own" onchange="toggleOwnField(this.checked)">
            <label for="f-is-own" style="color:var(--blue);font-weight:bold;font-size:11px;cursor:pointer">¿ES CAMPO PROPIO?</label>
        </div>
        <div class="form-group" id="prod-group">
            <label>Productor (Quien lo trabaja)</label>
            <input type="text" id="f-producer" class="form-input" placeholder="Ej: Martínez Hnos. SRL">
        </div>
        <div class="form-group">
            <label>Dueño (Propietario)</label>
            <input type="text" id="f-owner" class="form-input" placeholder="Nombre del propietario">
        </div>
        <div class="form-group" id="date-group">
            <label>Mes/Año Inicio Arrendamiento</label>
            <input type="month" id="f-date" class="form-input">
        </div>
        <div class="form-group">
            <label>Superficie (Ha)</label>
            <input type="number" id="f-ha" step="0.1" class="form-input">
            <div id="ha-hint" style="display:none;font-size:11px;color:#666;margin-top:5px;"></div>
        </div>
        <div class="form-group">
            <label>Notas Técnicas</label>
            <textarea id="f-notes" class="form-input" rows="2" placeholder="Alfalfa, rotación, rastrojos..."></textarea>
        </div>
        <button onclick="saveField()" class="btn-primary">✓ GUARDAR LOTE</button>
        <button onclick="closeModal()" class="btn-cancel">Cancelar</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
    // ── Firebase (tu configuración sin cambios) ───────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyDi70QeV1iJhGg-s4jvvgDGkzY25sk4DMM",
      authDomain: "agrolease-cloud.firebaseapp.com",
      projectId: "agrolease-cloud",
      storageBucket: "agrolease-cloud.firebasestorage.app",
      messagingSenderId: "1028397749370",
      appId: "1:1028397749370:web:e9535daccb3d8dba37d7c3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ── Persistencia offline ──────────────────────────────────────────────────
    // Cachea los lotes en el dispositivo: la app sigue funcionando sin señal en
    // el campo y sincroniza sola cuando vuelve la conexión.
    // Debe llamarse ANTES de cualquier otra operación de Firestore.
    db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        if (err.code === 'failed-precondition')      console.warn('Persistencia offline: hay varias pestañas abiertas.');
        else if (err.code === 'unimplemented')       console.warn('Persistencia offline: navegador no compatible.');
        else                                        console.warn('Persistencia offline no disponible:', err);
    });

    // ── Estado ────────────────────────────────────────────────────────────────
    let map, drawnItems, lastLayer, editingId = null;
    let drawControl, polygonDrawHandler = null;
    let fields = [];
    const colors = { 0:'#9ca3af', 1:'#22c55e', 2:'#eab308', 3:'#ef4444', 4:'#3b82f6' };

    // ── Panel lateral ─────────────────────────────────────────────────────────
    // Un único estado (body.sb-cerrado) que se traduce distinto en cada tamaño:
    // en escritorio el panel comprime el mapa, en celular es un drawer encima.
    function aplicarEstadoSidebar() {
        const cerrado = document.body.classList.contains('sb-cerrado');
        const movil   = window.innerWidth <= 768;

        document.getElementById('sidebar').classList.toggle('hidden', !movil && cerrado);
        document.getElementById('sidebar').classList.toggle('open',    movil && !cerrado);
        document.getElementById('sidebarOverlay').classList.toggle('active', movil && !cerrado);
        document.getElementById('sidebar-handle').innerHTML = cerrado ? '❯' : '❮';

        // Solo en escritorio cambia el tamaño real del mapa.
        if (!movil) setTimeout(() => map && map.invalidateSize(), 300);
    }

    function toggleSidebar() {
        document.body.classList.toggle('sb-cerrado');
        aplicarEstadoSidebar();
    }
    function closeSidebar() {
        document.body.classList.add('sb-cerrado');
        aplicarEstadoSidebar();
    }
    function openSidebar() {
        document.body.classList.remove('sb-cerrado');
        aplicarEstadoSidebar();
    }

    // Arranque: en celular el panel empieza replegado; en escritorio, desplegado.
    if (window.innerWidth <= 768) document.body.classList.add('sb-cerrado');
    aplicarEstadoSidebar();

    // ── Helpers ───────────────────────────────────────────────────────────────
    function calculateStatus(f) {
        if (f.isOwn) return { year: 4, label: 'Propio' };
        if (!f.date) return { year: 0, label: 'Sin Fecha' };
        const diff = (new Date() - new Date(f.date)) / (1000*60*60*24*365.25);
        if (diff < 1) return { year: 1, label: 'Año 1' };
        if (diff < 2) return { year: 2, label: 'Año 2' };
        return { year: 3, label: 'Año 3' };
    }

    // ── Botón flotante "Añadir campo" → activa el dibujo de polígono ────────────
    function toggleAddField() {
        const btn = document.getElementById('add-field-btn');
        if (formaEnEdicion) return;   // primero hay que cerrar la edición en curso

        if (polygonDrawHandler) {
            // Ya está dibujando: el botón actúa como "Cancelar".
            polygonDrawHandler.disable();
            polygonDrawHandler = null;
            btn.classList.remove('drawing');
            btn.innerHTML = '✏️ Añadir campo';
            return;
        }

        if (window.innerWidth <= 768) closeSidebar();

        polygonDrawHandler = new L.Draw.Polygon(map, drawControl.options.draw.polygon);
        polygonDrawHandler.enable();
        btn.classList.add('drawing');
        btn.innerHTML = '✕ Cancelar';
    }

    // ── Editar la forma (los vértices) de un lote ya guardado ──────────────────
    let formaEnEdicion = null;   // { layer, id, coordsOriginales }

    function editarForma(id) {
        if (formaEnEdicion) return;                       // ya hay una edición en curso
        if (polygonDrawHandler) toggleAddField();         // salimos del modo dibujo

        const f = fields.find(x => x.id === id);
        if (!f || !Array.isArray(f.coords)) return;

        let capa = null;
        drawnItems.eachLayer(l => { if (l._loteId === id) capa = l; });
        if (!capa) return alert("No se encontró el polígono de ese lote.");

        map.closePopup();
        formaEnEdicion = { layer: capa, id, coordsOriginales: f.coords.map(c => [c[0], c[1]]) };
        capa.editing.enable();

        document.getElementById('edit-shape-title').textContent = f.isOwn ? f.owner : f.producer;
        document.getElementById('edit-shape-bar').classList.add('visible');
        document.getElementById('add-field-btn').classList.add('oculto');
        if (window.innerWidth <= 768) closeSidebar();
    }

    function terminarEdicionForma() {
        if (!formaEnEdicion) return;
        formaEnEdicion.layer.editing.disable();
        formaEnEdicion = null;
        document.getElementById('edit-shape-bar').classList.remove('visible');
        document.getElementById('add-field-btn').classList.remove('oculto');
    }

    function guardarForma() {
        if (!formaEnEdicion) return;
        const { layer, id } = formaEnEdicion;

        const latlngs = layer.getLatLngs()[0];
        if (latlngs.length < 3) return alert("El lote necesita al menos 3 vértices.");

        const coords = latlngs.map(ll => [ll.lat, ll.lng]);
        const ha     = +(L.GeometryUtil.geodesicArea(latlngs) / 10000).toFixed(1);

        terminarEdicionForma();   // libera el bloqueo de renderAll antes de escribir

        db.collection("lotes").doc(id.toString())
          .update({ coords: JSON.stringify(coords), ha })
          .catch(err => {
              console.error("Error al guardar la forma:", err);
              alert("❌ No se pudo guardar la forma: " + err.message);
              renderAll();        // volvemos a dibujar desde los datos buenos
          });
    }

    function cancelarForma() {
        if (!formaEnEdicion) return;
        const { layer, coordsOriginales } = formaEnEdicion;
        layer.setLatLngs(coordsOriginales);   // descartamos los vértices movidos
        terminarEdicionForma();
        renderAll();
    }

    function toggleOwnField(isOwn) {
        document.getElementById('prod-group').style.display = isOwn ? 'none' : 'block';
        document.getElementById('date-group').style.display = isOwn ? 'none' : 'block';
    }

    // ── GPS: seguimiento en vivo (live tracking, estilo Google Maps) ─────────
    let isTracking = false;
    let liveMarker = null, liveCircle = null;
    let firstLocateFix = true;
    let gpsWarningTimeout = null;

    const liveLocationIcon = L.divIcon({
        className: 'gps-live-icon',
        html: '<div class="gps-marker-pulse"></div><div class="gps-marker-dot"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
    });

    function showGpsWarning(msg) {
        const el = document.getElementById('gps-warning');
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(gpsWarningTimeout);
        gpsWarningTimeout = setTimeout(() => { el.style.display = 'none'; }, 6000);
    }
    function hideGpsWarning() {
        clearTimeout(gpsWarningTimeout);
        document.getElementById('gps-warning').style.display = 'none';
    }

    function startTracking() {
        const btn = document.getElementById('track-btn');
        firstLocateFix = true;
        isTracking = true;
        btn.style.background = 'var(--success)';
        btn.textContent = '🎯 Siguiendo…';
        map.locate({
            watch: true,
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 20000
        });
    }

    function stopTracking() {
        const btn = document.getElementById('track-btn');
        map.stopLocate();
        isTracking = false;
        btn.style.background = '#6b7280';
        btn.textContent = '🎯 Seguir';
        hideGpsWarning();
    }

    function toggleTracking() {
        if (!navigator.geolocation) {
            alert('Tu navegador no soporta geolocalización.');
            return;
        }
        isTracking ? stopTracking() : startTracking();
    }

    function onLocationFound(e) {
        const { lat, lng } = e.latlng;
        const radius = e.accuracy;

        if (!liveMarker) {
            liveMarker = L.marker([lat, lng], { icon: liveLocationIcon, zIndexOffset: 1000, interactive: false }).addTo(map);
        } else {
            liveMarker.setLatLng([lat, lng]);
        }

        if (!liveCircle) {
            liveCircle = L.circle([lat, lng], {
                radius, color: '#4285F4', fillColor: '#4285F4', fillOpacity: 0.12, weight: 1, interactive: false
            }).addTo(map);
        } else {
            liveCircle.setLatLng([lat, lng]).setRadius(radius);
        }

        if (isTracking) {
            if (firstLocateFix) {
                // Primer fix del GPS al arrancar: la cámara "cae" directo sobre la posición real.
                map.flyTo([lat, lng], 17);
                firstLocateFix = false;
            } else {
                map.panTo([lat, lng]);
            }
        }
        hideGpsWarning();
    }

    function onLocationError(e) {
        // No rompemos la app ni tocamos los lotes guardados: solo avisamos si el seguimiento sigue activo.
        if (!isTracking) return;
        const msgs = {
            1: '⚠️ Permiso de ubicación denegado. Habilitalo en el navegador para ver tu posición.',
            2: '⚠️ Señal GPS débil o perdida. Buscando señal…',
            3: '⚠️ Tardando en obtener la posición. Buscando señal…'
        };
        showGpsWarning(msgs[e.code] || '⚠️ No se pudo obtener tu ubicación.');
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  Avisos de vencimiento de arrendamiento
    //  El contrato se toma a 3 años desde la fecha de inicio. Avisamos cuando
    //  faltan 12, 6 y 3 meses, y cuando ya venció.
    // ══════════════════════════════════════════════════════════════════════════
    const HITOS = [
        { clave: '12m',  meses: 12, texto: 'Falta 1 año',     color: '#eab308' },
        { clave: '6m',   meses: 6,  texto: 'Faltan 6 meses',  color: '#f97316' },
        { clave: '3m',   meses: 3,  texto: 'Faltan 3 meses',  color: '#ef4444' },
        { clave: 'venc', meses: 0,  texto: 'VENCIDO',         color: '#7f1d1d' }
    ];
    const CLAVE_AVISOS = 'agrolease_avisos_vistos';
    let vencimientosRevisados = false;

    // Meses que faltan hasta el fin del arrendamiento (null si no aplica).
    function mesesHastaVencimiento(f) {
        if (f.isOwn || !f.date) return null;
        const [anio, mes] = f.date.split('-').map(Number);
        if (!anio || !mes) return null;
        const venc = new Date(anio + 3, mes - 1, 1);
        const hoy  = new Date();
        return (venc.getFullYear() - hoy.getFullYear()) * 12 + (venc.getMonth() - hoy.getMonth());
    }

    // Hito más cercano ya alcanzado; null si todavía falta más de un año.
    function hitoDe(meses) {
        if (meses === null) return null;
        if (meses <= 0)  return HITOS[3];
        if (meses <= 3)  return HITOS[2];
        if (meses <= 6)  return HITOS[1];
        if (meses <= 12) return HITOS[0];
        return null;
    }

    function lotesPorVencer() {
        return fields
            .map(f => ({ f, meses: mesesHastaVencimiento(f) }))
            .map(o => ({ ...o, hito: hitoDe(o.meses) }))
            .filter(o => o.hito)
            .sort((a, b) => a.meses - b.meses);
    }

    function leerAvisosVistos() {
        try { return JSON.parse(localStorage.getItem(CLAVE_AVISOS) || '{}'); }
        catch { return {}; }
    }
    function guardarAvisosVistos(v) {
        try { localStorage.setItem(CLAVE_AVISOS, JSON.stringify(v)); } catch {}
    }

    // ── Notificación del sistema ──────────────────────────────────────────────
    async function mostrarNotificacion(cantidad) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const cuerpo = 'Se acerca el vencimiento de ' +
            (cantidad === 1 ? 'un arrendamiento' : `${cantidad} arrendamientos`) +
            ', entrá para revisar con más detalle.';
        try {
            // En Android hay que pasar por el service worker; new Notification() falla.
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg) {
                reg.showNotification('AgroLease Tracker', {
                    body: cuerpo, icon: './icon-192.png', badge: './icon-192.png', tag: 'agrolease-vencimientos'
                });
            } else {
                new Notification('AgroLease Tracker', { body: cuerpo, icon: './icon-192.png' });
            }
        } catch (e) { console.warn('No se pudo mostrar la notificación:', e); }
    }

    async function pedirPermisoNotificaciones() {
        if (!('Notification' in window)) {
            alert('Este navegador no soporta notificaciones.');
            return false;
        }
        if (Notification.permission === 'granted') return true;
        if (Notification.permission === 'denied') {
            alert('Las notificaciones están bloqueadas para este sitio. Habilitalas desde los ajustes del navegador.');
            return false;
        }
        const r = await Notification.requestPermission();
        actualizarCampana();
        return r === 'granted';
    }

    // ── Revisión: corre al cargar los lotes y al abrir la app ─────────────────
    function revisarVencimientos() {
        const pendientes = lotesPorVencer();
        actualizarCampana(pendientes.length);

        // Solo avisamos por hitos nuevos: si ya avisamos "6 meses" no repetimos
        // hasta que el lote pase a "3 meses".
        const vistos = leerAvisosVistos();
        const orden  = HITOS.map(h => h.clave);
        let nuevos = 0;

        pendientes.forEach(({ f, hito }) => {
            const previo = vistos[f.id];
            if (previo === undefined || orden.indexOf(hito.clave) > orden.indexOf(previo)) {
                vistos[f.id] = hito.clave;
                nuevos++;
            }
        });

        if (nuevos > 0) {
            guardarAvisosVistos(vistos);
            mostrarNotificacion(nuevos);
            abrirPanelVencimientos();     // además lo mostramos dentro de la app
        }
    }

    function actualizarCampana(cantidad) {
        if (cantidad === undefined) cantidad = lotesPorVencer().length;
        const badge = document.getElementById('bell-badge');
        const btn   = document.getElementById('bell-btn');
        badge.textContent = cantidad;
        badge.classList.toggle('visible', cantidad > 0);
        const activas = ('Notification' in window) && Notification.permission === 'granted';
        btn.classList.toggle('apagada', !activas);
        btn.title = activas
            ? `${cantidad} arrendamiento(s) próximos a vencer`
            : 'Tocá para activar las notificaciones de vencimiento';
    }

    // ── Panel dentro de la app ────────────────────────────────────────────────
    function abrirPanelVencimientos() {
        const panel = document.getElementById('venc-panel');
        const lista = lotesPorVencer();
        const permisoPendiente = ('Notification' in window) && Notification.permission !== 'granted';

        let html = `<div class="venc-head">
                        <b>Arrendamientos próximos a vencer</b>
                        <button onclick="cerrarPanelVencimientos()" style="border:none;background:none;font-size:18px;cursor:pointer;color:#999;line-height:1">×</button>
                    </div>`;

        if (permisoPendiente) {
            html += `<div class="venc-aviso-permiso">
                        Las notificaciones están desactivadas.
                        <a href="#" onclick="pedirPermisoNotificaciones();return false;" style="color:#92400e;font-weight:bold;">Activarlas</a>
                     </div>`;
        }

        if (!lista.length) {
            html += '<div class="venc-vacio">No hay arrendamientos por vencer en el próximo año.</div>';
        } else {
            html += lista.map(({ f, meses, hito }) => {
                const [a, m] = f.date.split('-').map(Number);
                const vence  = `${String(m).padStart(2,'0')}/${a + 3}`;
                const resta  = meses <= 0 ? 'ya vencido' : `en ${meses} mes${meses === 1 ? '' : 'es'}`;
                return `<div class="venc-item" data-id="${f.id}">
                            <span class="venc-pastilla" style="background:${hito.color}">${hito.texto}</span>
                            <div style="min-width:0;flex:1">
                                <div class="venc-nombre"></div>
                                <div class="venc-detalle">Vence ${vence} · ${resta} · ${f.ha} Ha</div>
                            </div>
                        </div>`;
            }).join('');
        }
        panel.innerHTML = html;

        // Nombres por textContent y click para ir al lote.
        panel.querySelectorAll('.venc-item').forEach(el => {
            const id = Number(el.dataset.id);
            const o  = lista.find(x => x.f.id === id);
            el.querySelector('.venc-nombre').textContent =
                o.f.producer + (o.f.owner ? '  ·  Dueño: ' + o.f.owner : '');
            el.onclick = () => {
                if (Array.isArray(o.f.coords)) map.fitBounds(L.polygon(o.f.coords).getBounds());
                cerrarPanelVencimientos();
            };
        });
        panel.classList.add('visible');
    }

    function cerrarPanelVencimientos() {
        document.getElementById('venc-panel').classList.remove('visible');
    }

    function togglePanelVencimientos() {
        const panel = document.getElementById('venc-panel');
        if (panel.classList.contains('visible')) { cerrarPanelVencimientos(); return; }
        // Si nunca se pidió el permiso, lo pedimos con este toque (hace falta un gesto).
        if (('Notification' in window) && Notification.permission === 'default') pedirPermisoNotificaciones();
        abrirPanelVencimientos();
    }

    // ── Buscador de localidades con sugerencias ───────────────────────────────
    // Nominatim pide no superar 1 consulta por segundo, así que esperamos a que
    // dejes de tipear antes de pedir, y cancelamos la búsqueda anterior.
    let sugerencias = [], sugerenciaActiva = -1;
    let locDebounce = null, locAbort = null;

    function cerrarSugerencias() {
        document.getElementById('loc-suggest').classList.remove('visible');
        sugerenciaActiva = -1;
    }

    // Recuadro de Argentina + sesgo hacia Las Varillas, para que lo cercano suba.
    const BBOX_AR = '-73.6,-55.1,-53.6,-21.8';
    const SESGO   = { lat: -32.71, lon: -62.72 };

    function etiquetaDe(p) {
        return {
            principal: p.name || '(sin nombre)',
            detalle: [p.county, p.state].filter(Boolean).join(' · ')
        };
    }

    function pintarSugerencias(lista) {
        const cont = document.getElementById('loc-suggest');
        sugerencias = lista;
        sugerenciaActiva = -1;

        if (!lista.length) {
            cont.innerHTML = '<div class="loc-vacio">Sin resultados</div>';
            cont.classList.add('visible');
            return;
        }
        cont.innerHTML = lista.map((_, i) =>
            `<div class="loc-item" data-i="${i}"><div class="principal"></div><div class="detalle"></div></div>`
        ).join('');

        // Texto por textContent: un nombre con < o & no puede romper el HTML.
        cont.querySelectorAll('.loc-item').forEach((el, i) => {
            const t = etiquetaDe(lista[i].properties);
            el.querySelector('.principal').textContent = t.principal;
            el.querySelector('.detalle').textContent   = t.detalle;
            el.onclick = () => elegirSugerencia(i);
        });
        cont.classList.add('visible');
    }

    function elegirSugerencia(i) {
        const s = sugerencias[i];
        if (!s) return;
        const p = s.properties;
        document.getElementById('loc-search').value = p.name || '';
        cerrarSugerencias();

        // extent viene como [oeste, norte, este, sur] cuando el lugar tiene superficie.
        if (p.extent && p.extent.length === 4) {
            const [o, n, e, s2] = p.extent;
            map.fitBounds([[s2, o], [n, e]]);
        } else {
            const [lon, lat] = s.geometry.coordinates;
            map.setView([lat, lon], 14);
        }
    }

    // Photon (OpenStreetMap) sí busca por prefijo: con "Las Vari" ya sugiere
    // "Las Varillas". Nominatim, en cambio, exige la palabra completa.
    async function pedirSugerencias(q) {
        if (locAbort) locAbort.abort();
        locAbort = new AbortController();
        try {
            const url = 'https://photon.komoot.io/api/'
                      + `?q=${encodeURIComponent(q)}&limit=15&lat=${SESGO.lat}&lon=${SESGO.lon}&bbox=${BBOX_AR}`;
            const res  = await fetch(url, { signal: locAbort.signal });
            const json = await res.json();

            const vistos = new Set();
            const lista = (json.features || [])
                // El recuadro es orientativo: filtramos por país para no mezclar Chile o Brasil.
                .filter(f => !f.properties.country || f.properties.country === 'Argentina')
                .filter(f => {
                    const t = etiquetaDe(f.properties);
                    const clave = t.principal + '|' + t.detalle;
                    if (vistos.has(clave)) return false;
                    vistos.add(clave);
                    return true;
                })
                // Primero pueblos y ciudades; después comercios, calles y demás.
                .sort((a, b) => (a.properties.osm_key === 'place' ? 0 : 1) -
                                (b.properties.osm_key === 'place' ? 0 : 1))
                .slice(0, 6);

            pintarSugerencias(lista);
        } catch (e) {
            if (e.name !== 'AbortError') { console.error(e); cerrarSugerencias(); }
        }
    }

    function alTipearLocalidad() {
        const q = document.getElementById('loc-search').value.trim();
        clearTimeout(locDebounce);
        if (q.length < 3) { cerrarSugerencias(); return; }
        if (!navigator.onLine) { cerrarSugerencias(); return; }   // sin señal no hay geocodificador
        locDebounce = setTimeout(() => pedirSugerencias(q), 450);
    }

    function moverSugerencia(paso) {
        const items = document.querySelectorAll('#loc-suggest .loc-item');
        if (!items.length) return;
        if (sugerenciaActiva >= 0) items[sugerenciaActiva].classList.remove('activo');
        sugerenciaActiva = (sugerenciaActiva + paso + items.length) % items.length;
        items[sugerenciaActiva].classList.add('activo');
        items[sugerenciaActiva].scrollIntoView({ block: 'nearest' });
    }

    // El botón "Ir" toma la sugerencia marcada, o busca directo lo escrito.
    async function buscarLocalidad() {
        if (sugerenciaActiva >= 0) return elegirSugerencia(sugerenciaActiva);
        if (sugerencias.length)    return elegirSugerencia(0);

        const q = document.getElementById('loc-search').value.trim();
        if (!q) return;
        if (!navigator.onLine) return alert('Necesitás conexión para buscar una localidad.');
        try {
            await pedirSugerencias(q);
            if (sugerencias.length) elegirSugerencia(0);
            else alert('No se encontró esa localidad.');
        } catch(e) { console.error(e); alert('No se pudo buscar la localidad.'); }
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    function init() {
        map = L.map('map', { zoomControl: false }).setView([-32.714, -62.719], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

        drawnItems = new L.FeatureGroup().addTo(map);

        // Instanciamos el control de dibujo solo para reutilizar sus opciones de polígono;
        // NO se agrega al mapa (.addTo) para que no muestre su toolbar por defecto.
        drawControl = new L.Control.Draw({
            draw: {
                polygon: { allowIntersection: false, showArea: true },
                rectangle: false, circle: false, marker: false, circlemarker: false, polyline: false
            }
        });

        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        // Arranque automático: pide permiso GPS y activa el seguimiento en vivo.
        startTracking();

        map.on(L.Draw.Event.CREATED, (e) => {
            polygonDrawHandler = null;
            document.getElementById('add-field-btn').classList.remove('drawing');
            document.getElementById('add-field-btn').innerHTML = '✏️ Añadir campo';

            if (lastLayer) map.removeLayer(lastLayer);
            lastLayer = e.layer;
            lastLayer.addTo(map);
            const area = L.GeometryUtil.geodesicArea(lastLayer.getLatLngs()[0]);
            document.getElementById('f-ha').value = (area / 10000).toFixed(1);
            editingId = null;
            openModal();
        });

        // Si el usuario cancela el dibujo (Esc / click derecho) sin terminar el polígono,
        // dejamos el botón "Añadir campo" en su estado normal.
        map.on(L.Draw.Event.DRAWSTOP, () => {
            polygonDrawHandler = null;
            document.getElementById('add-field-btn').classList.remove('drawing');
            document.getElementById('add-field-btn').innerHTML = '✏️ Añadir campo';
        });

        // Escucha en tiempo real desde Firebase
        db.collection("lotes").onSnapshot(
            (querySnapshot) => {
                fields = [];
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    if (typeof data.coords === 'string') data.coords = JSON.parse(data.coords);
                    fields.push(data);
                });
                renderAll();
                // Una sola revisión por apertura: después solo refrescamos el contador.
                if (!vencimientosRevisados) { vencimientosRevisados = true; revisarVencimientos(); }
                else actualizarCampana();
            },
            (err) => {
                // Sin esto el rechazo queda como error suelto en consola y la app
                // aparenta estar cargando para siempre.
                console.error("Error al leer los lotes:", err);
                showGpsWarning(err.code === 'permission-denied'
                    ? '⚠️ Sin permisos para leer los lotes. Cerrá sesión y volvé a entrar.'
                    : '⚠️ No se pudieron cargar los lotes: ' + err.code);
            }
        );

        actualizarEstadoConexion();
        setTimeout(() => map.invalidateSize(), 200);
    }

    // ── Modal ─────────────────────────────────────────────────────────────────
    function openModal()  { document.getElementById('modal-overlay').style.display = 'flex'; }
    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        // Si el lote era nuevo, sacamos del mapa el polígono temporal del dibujo.
        // (El definitivo lo vuelve a dibujar renderAll() desde Firestore.)
        if (!editingId && lastLayer) map.removeLayer(lastLayer);
        lastLayer  = null;
        editingId  = null;
        resetForm();
    }
    function resetForm() {
        ['f-owner','f-producer','f-ha','f-date','f-notes'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('f-is-own').checked = false;
        document.getElementById('ha-hint').style.display = 'none';
        toggleOwnField(false);
    }

    // Superficie real del polígono guardado, para detectar valores desfasados al editar.
    function mostrarHaDelPoligono(coords) {
        const hint = document.getElementById('ha-hint');
        if (!Array.isArray(coords) || coords.length < 3) { hint.style.display = 'none'; return; }

        const latlngs = coords.map(c => L.latLng(c[0], c[1]));
        const haReal  = L.GeometryUtil.geodesicArea(latlngs) / 10000;
        const haForm  = parseFloat(document.getElementById('f-ha').value || 0);

        // Solo avisamos si difiere más de 1%, para no molestar cuando ya coincide.
        if (haForm && Math.abs(haReal - haForm) / haForm < 0.01) { hint.style.display = 'none'; return; }

        hint.style.display = 'block';
        hint.innerHTML = `Según el polígono son <b>${haReal.toFixed(1)} Ha</b> ·
            <a href="#" onclick="document.getElementById('f-ha').value=${haReal.toFixed(1)};document.getElementById('ha-hint').style.display='none';return false;"
               style="color:var(--primary);font-weight:bold;">usar este valor</a>`;
    }

    // ── Guardar ───────────────────────────────────────────────────────────────
    function saveField() {
        const owner    = document.getElementById('f-owner').value;
        const producer = document.getElementById('f-producer').value;
        const isOwn    = document.getElementById('f-is-own').checked;
        if (!owner)              return alert("Ingresá el Propietario.");
        if (!isOwn && !producer) return alert("Ingresá el Productor.");

        const fieldId  = editingId ? editingId : Date.now();
        let rawCoords;
        if (editingId) {
            const original = fields.find(f => f.id === editingId);
            if (!original) return alert("No se encontró el lote que estabas editando. Recargá la app.");
            rawCoords = original.coords;
        } else {
            if (!lastLayer) return alert("No hay un polígono dibujado para guardar.");
            rawCoords = lastLayer.getLatLngs()[0].map(ll => [ll.lat, ll.lng]);
        }

        const data = {
            id:       fieldId,
            isOwn,
            owner,
            producer: isOwn ? owner : producer,
            ha:       parseFloat(document.getElementById('f-ha').value || 0),
            date:     isOwn ? null : document.getElementById('f-date').value,
            notes:    document.getElementById('f-notes').value,
            coords:   JSON.stringify(rawCoords)
        };

        // closeModal() se encarga de limpiar lastLayer/editingId; no los toques antes.
        db.collection("lotes").doc(fieldId.toString()).set(data)
            .then(() => closeModal())
            .catch(err => {
                console.error("Error al guardar:", err);
                alert("❌ No se pudo guardar el lote: " + err.message);
            });
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderAll() {
        // Mientras se editan los vértices de un lote no reconstruimos las capas:
        // clearLayers() destruiría el polígono que está en edición.
        if (formaEnEdicion) return;

        drawnItems.clearLayers();
        const list = document.getElementById('field-list');
        list.innerHTML = '';
        let totalHa = 0, alertas = 0;
        const q = document.getElementById('list-search').value.toLowerCase();

        fields.forEach(f => {
            const status  = calculateStatus(f);
            const matches = (f.producer||'').toLowerCase().includes(q) || (f.owner||'').toLowerCase().includes(q);

            let polyStyle = { color: colors[status.year], fillOpacity: 0.5, weight: 2 };
            if (q && !matches) { polyStyle.color = '#e5e7eb'; polyStyle.fillOpacity = 0.1; polyStyle.weight = 1; }
            else if (q && matches) { polyStyle.weight = 4; }

            if (matches) {
                totalHa += f.ha;
                if (status.year === 3) alertas++;
                const card = document.createElement('div');
                card.className = 'field-card';
                const workerLabel = f.isOwn
                    ? `${f.owner} <span style="font-size:10px;color:var(--blue)">(PROPIO)</span>`
                    : f.producer;
                card.innerHTML = `
                    <button class="btn-del-card" onclick="event.stopPropagation();deleteField(${f.id})">🗑</button>
                    <div class="fc-worker">${workerLabel}</div>
                    <div class="fc-details">${f.isOwn ? 'Superficie Propia' : 'Dueño: '+f.owner} · ${f.ha} Ha</div>
                    <div style="color:${colors[status.year]};font-size:9px;font-weight:bold;margin-top:5px;">${status.label}</div>
                `;
                card.onclick = () => {
                    if (Array.isArray(f.coords)) map.fitBounds(L.polygon(f.coords).getBounds());
                    // En mobile: cerrar sidebar al tocar un campo
                    if (window.innerWidth <= 768) closeSidebar();
                };
                list.appendChild(card);
            }

            if (Array.isArray(f.coords)) {
                const poly = L.polygon(f.coords, polyStyle).addTo(drawnItems);
                poly._loteId = f.id;   // para poder ubicar la capa al editar la forma
                if (!q || matches) {
                    const popupTitle = f.isOwn ? f.owner+' (PROPIO)' : f.producer;
                    poly.bindPopup(`
                        <b style="font-size:14px">${popupTitle}</b><br>
                        <span style="font-size:11px;color:#666">${f.isOwn ? 'Campo Propio' : 'Dueño: '+f.owner}</span><br>
                        Estado: ${status.label} · ${f.ha} Ha<br><br>
                        <button onclick="editField(${f.id})" style="padding:5px 9px;cursor:pointer;background:var(--primary);color:white;border:none;border-radius:4px;">Editar datos</button>
                        <button onclick="editarForma(${f.id})" style="padding:5px 9px;cursor:pointer;background:#1d4ed8;color:white;border:none;border-radius:4px;">Editar forma</button>
                        <button onclick="deleteField(${f.id})" style="padding:5px 9px;cursor:pointer;background:var(--danger);color:white;border:none;border-radius:4px;">Borrar</button>
                    `);
                }
            }
        });

        document.getElementById('total-ha').innerText    = Math.round(totalHa);
        document.getElementById('total-alerts').innerText = alertas;
    }

    // ── Editar / Borrar ───────────────────────────────────────────────────────
    function editField(id) {
        const f = fields.find(x => x.id === id);
        if (!f) return;
        editingId = id;
        document.getElementById('f-is-own').checked    = f.isOwn;
        document.getElementById('f-owner').value        = f.owner    || '';
        document.getElementById('f-producer').value     = f.isOwn ? '' : f.producer;
        document.getElementById('f-ha').value           = f.ha;
        document.getElementById('f-date').value         = f.date     || '';
        document.getElementById('f-notes').value        = f.notes    || '';
        toggleOwnField(f.isOwn);
        mostrarHaDelPoligono(f.coords);
        openModal();
    }

    function deleteField(id) {
        if (confirm('¿Borrar lote?')) {
            db.collection("lotes").doc(id.toString()).delete()
                .catch(err => console.error("Error al borrar:", err));
        }
    }

    // ── Backup / Import ───────────────────────────────────────────────────────
    function exportData() {
        if (!fields.length) return alert("Todavía no hay lotes para respaldar.");
        const blob = new Blob([JSON.stringify(fields, null, 2)], { type:'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = `agro_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onerror = () => { alert("❌ No se pudo leer el archivo."); input.value = ''; };
        reader.onload  = async () => {
            let backupFields;
            try {
                backupFields = JSON.parse(reader.result);
                if (!Array.isArray(backupFields)) throw new Error("el archivo no contiene una lista de lotes");
                if (!backupFields.every(f => f && f.id != null)) throw new Error("hay lotes sin ID");
            } catch (err) {
                alert("❌ Backup inválido: " + err.message);
                input.value = '';
                return;
            }

            if (!confirm(`¿Subir ${backupFields.length} lotes a la nube?\n\nLos lotes que tengan el mismo ID se van a SOBRESCRIBIR.`)) {
                input.value = '';
                return;
            }

            try {
                // Escritura por lotes: mucho más rápido que un set() por documento.
                for (let i = 0; i < backupFields.length; i += 400) {
                    const batch = db.batch();
                    backupFields.slice(i, i + 400).forEach(f => {
                        const dataToSave = { ...f };
                        if (Array.isArray(dataToSave.coords)) {
                            dataToSave.coords = JSON.stringify(dataToSave.coords);
                        }
                        batch.set(db.collection("lotes").doc(f.id.toString()), dataToSave);
                    });
                    await batch.commit();
                }
                alert(`✓ ${backupFields.length} lotes cargados en la nube correctamente.`);
            } catch (err) {
                console.error("Error al importar:", err);
                alert("❌ Error al subir el backup: " + err.message);
            }
            input.value = '';
        };
        reader.readAsText(file);
    }

    // ── Bloquear pull-to-refresh (Android Chrome / Safari iOS) ───────────────
    let lastTouchY = 0;
    document.addEventListener('touchstart', e => { lastTouchY = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchmove', e => {
        const el = e.target.closest('#field-list, .modal-box');
        if (!el) { e.preventDefault(); return; }
        const dy = e.touches[0].clientY - lastTouchY;
        if ((el.scrollTop === 0 && dy > 0) || (el.scrollTop + el.clientHeight >= el.scrollHeight && dy < 0))
            e.preventDefault();
    }, { passive: false });

    // ── Autenticación ─────────────────────────────────────────────────────────
    // La sesión queda guardada en el dispositivo (persistencia LOCAL), así que
    // solo hay que ingresar la primera vez —también funciona sin señal.
    let appIniciada = false;

    function mostrarErrorLogin(msg) {
        const el = document.getElementById('login-error');
        el.textContent = msg;
        el.classList.add('visible');
    }

    async function iniciarSesion(ev) {
        ev.preventDefault();
        const btn   = document.getElementById('login-btn');
        const email = document.getElementById('login-email').value.trim();
        const pass  = document.getElementById('login-pass').value;

        document.getElementById('login-error').classList.remove('visible');
        btn.disabled = true;
        btn.textContent = 'Entrando…';

        try {
            await firebase.auth().signInWithEmailAndPassword(email, pass);
            // onAuthStateChanged se encarga de ocultar la pantalla y arrancar la app.
        } catch (err) {
            const msgs = {
                'auth/invalid-email':                'El email no es válido.',
                'auth/user-not-found':               'No existe una cuenta con ese email.',
                'auth/wrong-password':               'Contraseña incorrecta.',
                'auth/invalid-credential':           'Email o contraseña incorrectos.',
                'auth/invalid-login-credentials':    'Email o contraseña incorrectos.',
                'auth/too-many-requests':            'Demasiados intentos. Esperá unos minutos.',
                'auth/network-request-failed':       'Sin conexión. Necesitás señal para el primer ingreso.',
                'auth/operation-not-allowed':        'Falta habilitar el acceso por Email/Contraseña en la consola de Firebase.',
                'auth/configuration-not-found':      'Falta activar Authentication en la consola de Firebase (Build → Authentication → Comenzar).'
            };
            // Firebase a veces devuelve el error crudo del backend en vez de un código.
            const crudo = (err.message || '');
            if (!msgs[err.code] && crudo.includes('CONFIGURATION_NOT_FOUND')) {
                mostrarErrorLogin(msgs['auth/configuration-not-found']);
            } else {
                mostrarErrorLogin(msgs[err.code] || ('No se pudo entrar: ' + (err.code || err.message)));
            }
        } finally {
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    }

    // Sin botón en pantalla: la sesión queda guardada en el dispositivo.
    // Para cerrarla (por ejemplo si prestás o vendés la tablet) se puede llamar
    // cerrarSesion() desde la consola del navegador, o borrar los datos del sitio.
    function cerrarSesion() {
        firebase.auth().signOut().then(() => location.reload());
    }

    firebase.auth().onAuthStateChanged(user => {
        const overlay = document.getElementById('login-overlay');
        if (user) {
            overlay.classList.remove('visible');
            document.getElementById('login-pass').value = '';
            if (!appIniciada) { appIniciada = true; init(); }
        } else {
            overlay.classList.add('visible');
        }
    });

    // ── Estado de conexión ────────────────────────────────────────────────────
    function actualizarEstadoConexion() {
        document.getElementById('offline-badge')
                .classList.toggle('visible', !navigator.onLine);
    }
    window.addEventListener('online',  actualizarEstadoConexion);
    window.addEventListener('offline', actualizarEstadoConexion);

    // ── Eventos del buscador de localidades ───────────────────────────────────
    const inputLoc = document.getElementById('loc-search');
    inputLoc.addEventListener('input', alTipearLocalidad);
    inputLoc.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown')      { e.preventDefault(); moverSugerencia(1); }
        else if (e.key === 'ArrowUp')   { e.preventDefault(); moverSugerencia(-1); }
        else if (e.key === 'Enter')     { e.preventDefault(); buscarLocalidad(); inputLoc.blur(); }
        else if (e.key === 'Escape')    { cerrarSugerencias(); }
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.loc-wrap')) cerrarSugerencias();
    });

    // Debounce: evita reconstruir los ~170 polígonos en cada tecla (tironea en tablet).
    let searchDebounce = null;
    document.getElementById('list-search').oninput = () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(renderAll, 200);
    };
    // init() ya no se llama directo: lo dispara onAuthStateChanged al haber sesión.
    window.addEventListener('resize', () => {
        aplicarEstadoSidebar();   // el panel se comporta distinto según el ancho
        setTimeout(() => map && map.invalidateSize(), 150);
    });
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(reg => {
                console.log("Service Worker registrado");
                // Si hay una versión nueva publicada, la tomamos en la próxima apertura.
                reg.addEventListener('updatefound', () => console.log("Actualizando AgroLease…"));
            })
            .catch(err => console.warn("Service Worker no disponible:", err));
    }
</script>
